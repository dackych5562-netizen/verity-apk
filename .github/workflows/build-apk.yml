name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RENPY_VERSION: 8.5.3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Ren'Py SDK and Android tools (RAPT)
        run: |
          cd $HOME
          wget -q https://www.renpy.org/dl/$RENPY_VERSION/renpy-$RENPY_VERSION-sdk.tar.bz2
          tar xjf renpy-$RENPY_VERSION-sdk.tar.bz2
          mv renpy-$RENPY_VERSION-sdk renpy
          wget -q https://www.renpy.org/dl/$RENPY_VERSION/renpy-$RENPY_VERSION-rapt.zip
          unzip -q renpy-$RENPY_VERSION-rapt.zip -d renpy
          ls renpy renpy/rapt

      - name: Point RAPT at the runner's Android SDK
        run: |
          set +e
          {
            echo "ANDROID_HOME=$ANDROID_HOME"; ls $ANDROID_HOME
            ls $HOME/renpy/rapt
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
            rm -rf $HOME/renpy/rapt/Sdk
            ln -sfn $ANDROID_HOME $HOME/renpy/rapt/Sdk
            mkdir -p $HOME/renpy/rapt/project
            echo "sdk.dir=$ANDROID_HOME" > $HOME/renpy/rapt/project/local.properties
          } 2>&1 | tee $GITHUB_WORKSPACE/sdk.log
          true

      - name: Create signing keys
        run: |
          mkdir -p project
          cp -r game .android.json android-icon_foreground.png android-icon_background.png android-presplash.jpg project/
          for k in android bundle; do
            keytool -genkey -v -keystore project/$k.keystore -alias android \
              -keyalg RSA -keysize 2048 -validity 20000 \
              -storepass android -keypass android \
              -dname "CN=Verity, O=Verity, C=UA"
          done
          printf 'key.alias=android\nkey.store.password=android\nkey.alias.password=android\nkey.store=%s\n' "$PWD/project/android.keystore" >> $HOME/renpy/rapt/project/local.properties
          printf 'key.alias=android\nkey.store.password=android\nkey.alias.password=android\nkey.store=%s\n' "$PWD/project/bundle.keystore" > $HOME/renpy/rapt/project/bundle.properties

      - name: Build APK
        run: |
          cd $HOME/renpy
          set -o pipefail
          ./renpy.sh launcher android_build "$GITHUB_WORKSPACE/project" --destination "$GITHUB_WORKSPACE/out" 2>&1 | tee $GITHUB_WORKSPACE/build.log
          ls -la "$GITHUB_WORKSPACE/out" || true
          find $HOME/renpy/rapt -name "*.apk" -newer "$GITHUB_WORKSPACE/.android.json" || true

      - name: Collect APK
        run: |
          mkdir -p dist
          find "$GITHUB_WORKSPACE/out" -name "*.apk" -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls dist/*.apk 2>/dev/null)"

      - uses: actions/upload-artifact@v4
        with:
          name: Verity-apk
          path: dist/*.apk

      - name: Publish APK as a release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.apk --title "Verity for Android" --notes "Tap the .apk file below to download it to your phone."

      - name: Push logs to logs branch
        if: always()
        run: |
          mkdir -p /tmp/logs && cp sdk.log build.log /tmp/logs/ 2>/dev/null || true
          find $HOME/renpy/rapt -maxdepth 3 > /tmp/logs/tree.txt 2>/dev/null || true
          find $HOME/.renpy $HOME/renpy -name "*.txt" -path "*log*" -newer .android.json -exec cp {} /tmp/logs/ \; 2>/dev/null || true
          cp $HOME/renpy/tmp/*.txt /tmp/logs/ 2>/dev/null || true
          cd /tmp/logs && git init -q -b logs && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "logs $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs
